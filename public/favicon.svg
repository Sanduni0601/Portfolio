<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Yellow ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#EAB308" stroke-width="2.5"/>
  <!-- Initials SN -->
  <text x="32" y="39" font-family="Georgia, serif" font-size="22" font-weight="bold"
        fill="#EAB308" text-anchor="middle" letter-spacing="1">SN</text>
</svg>
